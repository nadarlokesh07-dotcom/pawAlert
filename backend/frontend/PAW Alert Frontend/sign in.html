<script>
  // Initialize password visibility controls for the sign-in form.
  // Find the password controls and register their behavior.
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('login-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      // Toggle the password input type and matching icon.
      // Switch between masked and visible password text.
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
