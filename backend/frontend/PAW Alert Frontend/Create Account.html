<script>
  // Show or hide a password field and update its visibility icon.
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    icon.style.transform = 'scale(0.7)';
    // Finish the icon transition after changing the input type.
    setTimeout(() => {
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
      icon.style.transform = 'scale(1)';
    }, 100);
  }

  // Ripple effect on button click
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) {
    // Create a short-lived ripple at the pointer location.
    submitBtn.addEventListener('click', function (e) {
      const rect = submitBtn.getBoundingClientRect();
      const circle = document.createElement('span');
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;
      circle.classList.add('ripple');

      const existingRipple = submitBtn.querySelector('.ripple');
      if (existingRipple) {
        existingRipple.remove();
      }

      submitBtn.appendChild(circle);
    });
  }

  const form = document.getElementById('createAccountForm');
  if (form) {
    // Validate the account form and show a brief account-creation state.
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const pass = document.getElementById('password')?.value;
      const confirmPass = document.getElementById('confirmPassword')?.value;
      const terms = document.getElementById('termsCheckbox')?.checked;

      if (!terms) {
        alert('Please accept the Terms & Conditions and Privacy Policy to continue.');
        return;
      }

      if (pass && confirmPass && pass !== confirmPass) {
        alert('Passwords do not match. Please verify and try again.');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <span class="relative z-10 flex items-center gap-2">
            <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
            <span>Creating Account...</span>
          </span>
        `;
      }

      // Redirect to sign-in after the creation animation finishes.
      // Navigate to the sign-in page after the submit feedback ends.
      setTimeout(() => {
        window.location.href = 'sign in.html';
      }, 700);
    });
  }
</script></main>
