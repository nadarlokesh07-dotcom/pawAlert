<script>
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('distance-dropdown-container');
    const toggleBtn = document.getElementById('distance-toggle-btn');
    const menu = document.getElementById('distance-menu');
    const label = document.getElementById('selected-distance-label');
    const chevron = document.getElementById('dropdown-chevron');
    const options = document.querySelectorAll('.distance-option');

    function openDropdown() {
      menu.classList.remove('hidden');
      chevron.classList.add('rotate-180');
      toggleBtn.setAttribute('aria-expanded', 'true');
    }

    function closeDropdown() {
      menu.classList.add('hidden');
      chevron.classList.remove('rotate-180');
      toggleBtn.setAttribute('aria-expanded', 'false');
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = !menu.classList.contains('hidden');
      if (isOpen) {
        closeDropdown();
      } else {
        openDropdown();
      }
    });

    options.forEach(option => {
      option.addEventListener('click', (e) => {
        e.stopPropagation();
        const value = option.getAttribute('data-value');
        label.textContent = value;

        // Update active classes and checkmark visibility
        options.forEach(opt => {
          const checkIcon = opt.querySelector('.check-icon');
          if (opt === option) {
            opt.classList.add('bg-blue-50/50', 'text-blue-600', 'font-semibold');
            opt.classList.remove('text-slate-700');
            if (checkIcon) checkIcon.classList.remove('hidden');
          } else {
            opt.classList.remove('bg-blue-50/50', 'text-blue-600', 'font-semibold');
            opt.classList.add('text-slate-700');
            if (checkIcon) checkIcon.classList.add('hidden');
          }
        });

        closeDropdown();
      });
    });

    // Close when clicking outside
    document.addEventListener('click', (e) => {
      if (!container.contains(e.target)) {
        closeDropdown();
      }
    });

    // Accept Button Handler
    const acceptBtns = document.querySelectorAll('.accept-btn');
    acceptBtns.forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        if (this.disabled) return;
        this.disabled = true;
        this.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'active:scale-[0.98]');
        this.classList.add('bg-emerald-600', 'text-white', 'cursor-default', 'opacity-95');
        this.innerHTML = `
          <svg class="w-3.5 h-3.5 text-white flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4.5 12.75l6 6 9-13.5"></path>
          </svg>
          <span class="truncate">Request Accepted</span>
        `;
      });
    });
  });
</script>
